name: Publish verified SpicyPrinter installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify approved installer
        env:
          SOURCE: https://b893f067-11a6-4d83-a0ef-54b2bf9ab8ae-00-2efh7eqxd5kfz.picard.replit.dev/api/kitchen-operations/printer-release-bootstrap-76f5bba36956a4ae4ba6864bcdb5c8fda279277a19f5d38c45d1915e0f934c0d
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 600 --output SpicyPrinter-0.1.1-Windows-x64-Setup.exe "$SOURCE"
          test "$(stat -c%s SpicyPrinter-0.1.1-Windows-x64-Setup.exe)" = 115754162
          echo "76f5bba36956a4ae4ba6864bcdb5c8fda279277a19f5d38c45d1915e0f934c0d  SpicyPrinter-0.1.1-Windows-x64-Setup.exe" | sha256sum --check
      - name: Attach verified installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.1 SpicyPrinter-0.1.1-Windows-x64-Setup.exe --repo SpicyDevelopment/SpicyPrinter
